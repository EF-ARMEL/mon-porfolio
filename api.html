<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1> Salut ! </h1> <br>
    <h3> on teste les api</h3>

<script>  
 async function test() {
    try {
        const reponse = await fetch(
            'https://jsonplaceholder.typicode.com/posts' ,{
                method : 'POST',
                 body : JSON.stringify({
                     titre: 'Appartement 3 pièces à Cocody',
                    prix: 450000,
                    ville: 'Abidjan'
                 }),
                 headers :{
                    'Content-Type' : 'application/json'
                 }

            }
    
        );

      if(!reponse.ok){
        throw new Error(`Erreur : ${reponse.status}`);
        
      }
        const data = await reponse.json();
        console.log(data);
        console.log(data.ville);
        console.log(reponse.headers.get('Content-type'));

    } catch (error) {
        console.log(error);
    }
}

test();
</script>
</body>

</html>
